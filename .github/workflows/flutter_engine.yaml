name: Flutter Engine
on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
env:
  TAR_OPTIONS: --no-same-owner
jobs:
  Download-Source:
    name: 'Download Flutter Source'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Get Flutter version'
        id: flutter-version
        run: |
          read -r FLUTTER_VERSION < version/flutter.version
          FLUTTER_HASH=$(git ls-remote https://github.com/flutter/flutter.git "refs/tags/${FLUTTER_VERSION}" | cut -f1)
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> $GITHUB_OUTPUT
          echo "FLUTTER_HASH=${FLUTTER_HASH}" >> $GITHUB_OUTPUT
      - name: 'Check for cached Flutter source'
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            depot_tools
            flutter
          key: flutter-source-${{ steps.flutter-version.outputs.FLUTTER_VERSION }}-${{ steps.flutter-version.outputs.FLUTTER_HASH }}
      - name: 'Install depot tools'
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone \
            --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            ./depot_tools
          rm -rf ./depot_tools/.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
      - name: 'Download Flutter source'
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
        run: |
          mkdir -p flutter
          cp files/dot-gclient ./flutter/.gclient
          cd flutter
          gclient sync \
            --revision ${FLUTTER_VERSION} \
            --delete_unversioned_trees \
            --reset \
            --no-history \
            --shallow
      - name: 'Cache Flutter Source'
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            depot_tools
            flutter
          key: flutter-source-${{ steps.flutter-version.outputs.FLUTTER_VERSION }}-${{ steps.flutter-version.outputs.FLUTTER_HASH }}

  Build-Engine:
    name: 'Build Flutter Engine'
    needs: Download-Source
    runs-on: [self-hosted, linux, x64]
    strategy:
      max-parallel: 1
      matrix:
        runtime-mode: [debug-unoptimized, debug, profile, release]
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Get Flutter version'
        id: flutter-version
        run: |
          read -r FLUTTER_VERSION < version/flutter.version
          FLUTTER_HASH=$(git ls-remote https://github.com/flutter/flutter.git "refs/tags/${FLUTTER_VERSION}" | cut -f1)
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> $GITHUB_OUTPUT
          echo "FLUTTER_HASH=${FLUTTER_HASH}" >> $GITHUB_OUTPUT
      - name: 'Get depot_tools and flutter source from cache'
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            depot_tools
            flutter
          key: flutter-source-${{ steps.flutter-version.outputs.FLUTTER_VERSION }}-${{ steps.flutter-version.outputs.FLUTTER_HASH }}
          fail-on-cache-miss: true
      - name: 'Install depot_tools in GITHUB_PATH'
        run: |
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
      - name: 'Configure Flutter Engine'
        working-directory: flutter/engine/src
        run: |
          ./flutter/tools/gn \
            ${{ endsWith(matrix.runtime-mode, '-unoptimized') && '--unoptimized' || '' }} \
            --no-enable-unittests \
            --runtime-mode ${{ matrix.runtime-mode == 'debug-unoptimized' && 'debug' || matrix.runtime-mode }} \
            --target-os linux \
            --linux-cpu arm64 \
            --no-goma \
            --embedder-for-target \
            --lto \
            --enable-vulkan \
            --target-dir build \
            --no-build-glfw-shell \
            --no-build-embedder-examples \
            ${{ startsWith(matrix.runtime-mode, 'debug-') && '--no-stripped' || '' }}
      - name: 'Build Flutter Engine'
        working-directory: flutter/engine/src/out/build
        run: |
          ninja \
            libflutter_engine.so \
            flutter_embedder.h \
            icudtl.dat
      - name: 'Package artifacts'
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
        run: |
          mkdir artifacts
          cp flutter/engine/src/out/build/libflutter_engine.so ./artifacts
          cp flutter/engine/src/out/build/icudtl.dat ./artifacts
          cp flutter/engine/src/out/build/flutter_embedder.h ./artifacts
          cd artifacts
          tar cvJf ../flutter-engine-arm64-${{ matrix.runtime-mode }}-${{ env.FLUTTER_VERSION }}.tar.xz ./*
      - name: 'Upload artifacts'
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-engine-arm64-${{ matrix.runtime-mode }}-${{ env.FLUTTER_VERSION }}.tar.xz
          path: flutter-engine-arm64-${{ matrix.runtime-mode }}-${{ env.FLUTTER_VERSION }}.tar.xz
  Release:
    name: 'Create GitHub Release'
    needs: Build-Engine
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Download build artifacts'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 'Get Flutter version'
        id: flutter-version
        run: |
          read -r FLUTTER_VERSION < version/flutter.version
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> $GITHUB_OUTPUT
      - name: 'Format Release Notes Template'
        env:
          FLUTTER_VERSION: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
        run: |
          sed -i "s/{{FLUTTER_VERSION}}/${{ env.FLUTTER_VERSION}}/g" files/release.md
      - name: 'Create GitHub Release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "${tag}" \
            --repo="${GITHUB_REPOSITORY}" \
            --title="Flutter Engine ${tag}" \
            --notes-file files/release.md \
            --latest \
            artifacts/*
